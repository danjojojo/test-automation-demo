openapi: 3.0.3
info:
  title: Restful Booker API
  description: A free to use Web API for practising API testing
  version: 1.0.0

servers:
  - url: https://restful-booker.herokuapp.com
    description: Production server

tags:
  - name: Auth
  - name: Booking
  - name: Ping

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
    basicAuth:
      type: http
      scheme: basic

  schemas:
    BookingDates:
      type: object
      required:
        - checkin
        - checkout
      properties:
        checkin:
          type: string
          format: date
          example: "2018-01-01"
          description: Date the guest is checking in
        checkout:
          type: string
          format: date
          example: "2019-01-01"
          description: Date the guest is checking out

    Booking:
      type: object
      required:
        - firstname
        - lastname
        - totalprice
        - depositpaid
        - bookingdates
      properties:
        firstname:
          type: string
          example: Jim
          description: Firstname for the guest who made the booking
        lastname:
          type: string
          example: Brown
          description: Lastname for the guest who made the booking
        totalprice:
          type: number
          example: 111
          description: The total price for the booking
        depositpaid:
          type: boolean
          example: true
          description: Whether the deposit has been paid or not
        bookingdates:
          $ref: '#/components/schemas/BookingDates'
        additionalneeds:
          type: string
          example: Breakfast
          description: Any other needs the guest has

    CreatedBooking:
      type: object
      properties:
        bookingid:
          type: number
          example: 1
          description: ID for newly created booking
        booking:
          $ref: '#/components/schemas/Booking'

    BookingId:
      type: object
      properties:
        bookingid:
          type: number
          example: 1
          description: ID of a specific booking

    AuthToken:
      type: object
      properties:
        token:
          type: string
          example: abc123
          description: Token to use in future requests

paths:
  /ping:
    get:
      tags:
        - Ping
      summary: HealthCheck
      operationId: Ping
      description: A simple health check endpoint to confirm whether the API is up and running.
      responses:
        '201':
          description: API is up and running
          content:
            text/plain:
              schema:
                type: string
                example: Created

  /auth:
    post:
      tags:
        - Auth
      summary: CreateToken
      operationId: CreateToken
      description: Creates a new auth token to use for access to the PUT and DELETE /booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  default: admin
                  description: Username for authentication
                password:
                  type: string
                  default: password123
                  description: Password for authentication
            example:
              username: admin
              password: password123
      responses:
        '200':
          description: Token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
              example:
                token: abc123

  /booking:
    get:
      tags:
        - Booking
      summary: GetBookingIds
      operationId: GetBookings
      description: Returns the ids of all the bookings that exist within the API. Can take optional query strings to search and return a subset of booking ids.
      parameters:
        - name: firstname
          in: query
          required: false
          schema:
            type: string
          description: Return bookings with a specific firstname
        - name: lastname
          in: query
          required: false
          schema:
            type: string
          description: Return bookings with a specific lastname
        - name: checkin
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Return bookings with a checkin date >= this value. Format CCYY-MM-DD
        - name: checkout
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Return bookings with a checkout date >= this value. Format CCYY-MM-DD
      responses:
        '200':
          description: List of booking IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingId'
              example:
                - bookingid: 1
                - bookingid: 2
                - bookingid: 3

    post:
      tags:
        - Booking
      summary: CreateBooking
      operationId: CreateBooking
      description: Creates a new booking in the API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
            example:
              firstname: Jim
              lastname: Brown
              totalprice: 111
              depositpaid: true
              bookingdates:
                checkin: "2018-01-01"
                checkout: "2019-01-01"
              additionalneeds: Breakfast
          text/xml:
            schema:
              type: string
              description: XML representation of a booking
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '200':
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedBooking'
              example:
                bookingid: 1
                booking:
                  firstname: Jim
                  lastname: Brown
                  totalprice: 111
                  depositpaid: true
                  bookingdates:
                    checkin: "2018-01-01"
                    checkout: "2019-01-01"
                  additionalneeds: Breakfast

  /booking/{id}:
    get:
      tags:
        - Booking
      summary: GetBooking
      operationId: GetBooking
      description: Returns a specific booking based upon the booking id provided
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The id of the booking you would like to retrieve
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            default: application/json
            enum:
              - application/json
              - application/xml
          description: Sets what format the response body is returned in
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              example:
                firstname: Sally
                lastname: Brown
                totalprice: 111
                depositpaid: true
                bookingdates:
                  checkin: "2013-02-23"
                  checkout: "2014-10-23"
                additionalneeds: Breakfast

    put:
      tags:
        - Booking
      summary: UpdateBooking
      operationId: UpdateBooking
      description: Updates a current booking
      security:
        - cookieAuth: []
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
          description: ID for the booking you want to update
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            default: application/json
            enum:
              - application/json
              - application/xml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
            example:
              firstname: James
              lastname: Brown
              totalprice: 111
              depositpaid: true
              bookingdates:
                checkin: "2018-01-01"
                checkout: "2019-01-01"
              additionalneeds: Breakfast
          text/xml:
            schema:
              type: string
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '200':
          description: Booking updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'

    patch:
      tags:
        - Booking
      summary: PartialUpdateBooking
      operationId: PartialUpdateBooking
      description: Updates a current booking with a partial payload
      security:
        - cookieAuth: []
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
          description: ID for the booking you want to update
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                lastname:
                  type: string
                totalprice:
                  type: number
                depositpaid:
                  type: boolean
                bookingdates:
                  $ref: '#/components/schemas/BookingDates'
                additionalneeds:
                  type: string
            example:
              firstname: James
              lastname: Brown
          text/xml:
            schema:
              type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Booking partially updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'

    delete:
      tags:
        - Booking
      summary: DeleteBooking
      operationId: DeleteBooking
      description: Deletes a booking from the API. Requires an authorization token to be set in the header or a Basic auth header.
      security:
        - cookieAuth: []
        - basicAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
          description: ID for the booking you want to delete
      responses:
        '201':
          description: Booking deleted successfully
          content:
            text/plain:
              schema:
                type: string
                example: Created
